name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Windows EXE
        working-directory: consumer-desktop
        run: |
          npm ci
          npm run dist

      - name: Upload unsigned EXE
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: consumer-desktop/dist-build/NFTFlicks.exe

